<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Tech stack illustration">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#121a2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#7a5cff"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <text x="40" y="42" fill="#e5eaf5" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Tech Stack</text>
  <rect x="40" y="76" width="920" height="150" rx="16" fill="#0f172a" stroke="rgba(255,255,255,0.08)"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    <rect x="70" y="100" width="120" height="44" rx="12" fill="#0f172a" stroke="url(#accent)"/>
    <text x="130" y="128" text-anchor="middle" fill="#00d2ff" font-size="18">TypeScript</text>

    <rect x="210" y="100" width="120" height="44" rx="12" fill="#0f172a" stroke="url(#accent)"/>
    <text x="270" y="128" text-anchor="middle" fill="#7a5cff" font-size="18">React</text>

    <rect x="350" y="100" width="120" height="44" rx="12" fill="#0f172a" stroke="url(#accent)"/>
    <text x="410" y="128" text-anchor="middle" fill="#ff6b6b" font-size="18">Node.js</text>

    <rect x="490" y="100" width="120" height="44" rx="12" fill="#0f172a" stroke="url(#accent)"/>
    <text x="550" y="128" text-anchor="middle" fill="#f9ca24" font-size="18">Python</text>

    <rect x="630" y="100" width="120" height="44" rx="12" fill="#0f172a" stroke="url(#accent)"/>
    <text x="690" y="128" text-anchor="middle" fill="#00d2ff" font-size="18">GraphQL</text>

    <rect x="770" y="100" width="120" height="44" rx="12" fill="#0f172a" stroke="url(#accent)"/>
    <text x="830" y="128" text-anchor="middle" fill="#7a5cff" font-size="18">Docker</text>

    <rect x="110" y="162" width="130" height="44" rx="12" fill="#0f172a" stroke="url(#accent)"/>
    <text x="175" y="190" text-anchor="middle" fill="#ff6b6b" font-size="18">GitHub</text>

    <rect x="270" y="162" width="150" height="44" rx="12" fill="#0f172a" stroke="url(#accent)"/>
    <text x="345" y="190" text-anchor="middle" fill="#00d2ff" font-size="18">Figma</text>

    <rect x="450" y="162" width="160" height="44" rx="12" fill="#0f172a" stroke="url(#accent)"/>
    <text x="530" y="190" text-anchor="middle" fill="#7a5cff" font-size="18">Web3</text>

    <rect x="640" y="162" width="180" height="44" rx="12" fill="#0f172a" stroke="url(#accent)"/>
    <text x="730" y="190" text-anchor="middle" fill="#f9ca24" font-size="18">Design Systems</text>
  </g>
</svg>
